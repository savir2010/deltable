[project]
name = "deltable"
version = "0.1.0"
description = "Stateless correction layer (typed slots + append-only correction log) in front of GBrain"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.13,<2",
    "pydantic>=2.7",
    "numpy>=1.26",
]

[project.optional-dependencies]
llm = ["anthropic>=0.70"]
postgres = ["psycopg[binary]>=3.2"]
dev = ["pytest>=8"]

[project.scripts]
delta-memory-mcp = "delta_memory.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["delta_memory"]

[tool.pytest.ini_options]
testpaths = ["tests"]
